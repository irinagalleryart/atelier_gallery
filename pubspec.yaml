name: atelier_gallery
description: "A Flutter application for Atelier Gallery supporting Web, Android, and iOS with Supabase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  shared_preferences: ^2.3.5
  supabase_flutter: ^2.8.3
  image_picker: ^1.1.2
  yaml: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/config/config.yaml
    - assets/branding/

# Configuration for flutter_launcher_icons (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/branding/logo_iriart.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/branding/logo_iriart.png"
    background_color: "#FCF7EA"
    theme_color: "#7B5E4B"


